name: Native Runtime Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime.c"
      - "setup_runtime.py"
      - "tests/**"
      - ".github/workflows/runtime-matrix.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-15
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build extension
        run: python setup_runtime.py build_ext --inplace

      - name: Test import
        run: python tests/test_runtime_import.py

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            *_mXkz2C4L16bEYJhyUXGQCOv*.so
            *_mXkz2C4L16bEYJhyUXGQCOv*.pyd
          if-no-files-found: error
